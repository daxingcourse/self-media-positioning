<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>奶茶定位所後台</title>
<meta name="theme-color" content="#E9D8C4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234A3226'/%3E%3Cpath d='M18 20h28l-4 34H22z' fill='%23C8A27C'/%3E%3Ccircle cx='27' cy='46' r='3' fill='%23FBF5EC'/%3E%3Ccircle cx='35' cy='48' r='3' fill='%23FBF5EC'/%3E%3Ccircle cx='31' cy='42' r='3' fill='%23FBF5EC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5EC; --foam:#F5EADB; --milk:#EBDCC8; --tea:#D9BC9A; --caramel:#C08B5C; --brown:#8A5E3F;
    --pearl:#4A3226; --ink:#3B2A20; --muted:#8E7766; --card:#FFFDF9; --line:#E6D3BD; --pink:#F2C6C2;
    --ok:#5E8C4A; --warn:#C0603F; --shadow-sm:0 3px 0 #E2CDB3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#231A15; --foam:#2C211B; --milk:#3A2C23; --tea:#6B4E3A; --caramel:#D9A274; --brown:#E6C2A0;
      --pearl:#F3E3D0; --ink:#F6EBDD; --muted:#BFA48E; --card:#2F241D; --line:#4A372B; --pink:#6E4846;
      --ok:#9BC487; --warn:#F09A7A; --shadow-sm:0 3px 0 #160F0B;
    }
  }
  :root[data-theme="dark"]{
    --cream:#231A15; --foam:#2C211B; --milk:#3A2C23; --tea:#6B4E3A; --caramel:#D9A274; --brown:#E6C2A0;
    --pearl:#F3E3D0; --ink:#F6EBDD; --muted:#BFA48E; --card:#2F241D; --line:#4A372B; --pink:#6E4846;
    --ok:#9BC487; --warn:#F09A7A; --shadow-sm:0 3px 0 #160F0B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3{font-family:'Huninn','Noto Sans TC',sans-serif;font-weight:400;color:var(--brown);margin:0}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Huninn';font-size:20px;color:var(--brown)}
  .brand small{display:block;font-family:'Noto Sans TC';font-size:11px;color:var(--muted);letter-spacing:.1em}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;overflow-x:auto}
  .tab{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:14px;white-space:nowrap}
  .tab.on{background:var(--caramel);border-color:var(--caramel);color:#fff}
  .card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
  .btn{border:2px solid var(--pearl);background:var(--caramel);color:#fff;border-radius:99px;padding:9px 20px;font-weight:700;box-shadow:0 3px 0 var(--pearl);transition:transform .1s}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pearl)}
  .btn.ghost{background:var(--card);color:var(--brown);border-color:var(--line);box-shadow:var(--shadow-sm)}
  .btn.sm{padding:5px 12px;font-size:13px}
  .btn.danger{color:var(--warn)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .input{width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--cream);outline:none}
  .input:focus{border-color:var(--caramel)}
  textarea.input{min-height:180px;resize:vertical;line-height:1.7}
  label.f{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}
  label.f .h{font-weight:400;color:var(--muted);margin-left:6px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  @media (max-width:760px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
  .stat{background:var(--foam);border-radius:18px;padding:14px 16px}
  .stat b{display:block;font-size:30px;font-family:'Huninn';color:var(--brown);line-height:1.2}
  .stat span{font-size:13px;color:var(--muted)}
  .bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
  .bar .t{height:12px;border-radius:99px;background:var(--foam);overflow:hidden}
  .bar .v{height:100%;background:var(--caramel);border-radius:99px}
  .bar .n{text-align:right;color:var(--muted)}
  .spark{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:10px}
  .spark div{flex:1;background:var(--tea);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
  .spark div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
  .pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--milk);color:var(--brown)}
  .pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .table-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--foam);color:var(--brown);font-weight:700;position:sticky;top:0}
  tr:last-child td{border-bottom:0}
  td select{padding:3px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--cream)}
  .item{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--cream)}
  .item.off{opacity:.6}
  .item-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .item-head .grow{flex:1;min-width:160px}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
  .switch i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .switch input:checked + i{background:var(--caramel)}
  .switch input:checked + i::after{left:19px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px}
  .chip.on{background:var(--caramel);border-color:var(--caramel);color:#fff}
  .vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .vars button{border:1.5px dashed var(--tea);background:transparent;border-radius:8px;padding:2px 8px;font-size:12px;color:var(--brown)}
  .num{width:80px}
  .savebar{position:sticky;bottom:12px;display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
  .login{max-width:400px;margin:12vh auto 0;text-align:center}
  .more{position:relative}
  .more summary{list-style:none;cursor:pointer}
  .more summary::-webkit-details-marker{display:none}
  .more-menu{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;z-index:8}
  @media (max-width:760px){.more-menu{position:fixed;left:16px;right:16px;top:auto;width:auto;margin-top:8px}}
  .more-head{font-family:'Huninn';color:var(--brown);padding:6px 10px 2px}
  .more-group{font-size:12px;color:var(--muted);font-weight:700;padding:10px 10px 4px}
  .more-item{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border-radius:12px}
  .more-item:hover{background:var(--foam)}
  .more-item a{flex:1;min-width:0;text-decoration:none;color:inherit;padding:4px 0}
  .more-item a b{display:block;font-size:14px}
  .more-item a span{display:block;font-size:12px;line-height:1.4}
  .pw-wrap{position:relative}
  .pw-wrap .input{padding-right:48px}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:18px;padding:4px 8px;border-radius:10px;opacity:.55;line-height:1}
  .eye:hover,.eye.on{opacity:1}
  .login .cup{font-size:60px;animation:bob 2.4s ease-in-out infinite;display:inline-block}
  @keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--pearl);color:var(--cream);padding:10px 20px;border-radius:99px;z-index:9;transition:transform .3s cubic-bezier(.34,1.56,.64,1);font-size:14px;max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{text-align:center;color:var(--muted);padding:30px}
  [hidden]{display:none!important}
  .linkrow{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;margin:6px 0}
  .linkrow code{font-size:12.5px;background:var(--foam);border-radius:10px;padding:6px 10px;overflow-x:auto;white-space:nowrap}
  @media (max-width:760px){.linkrow{grid-template-columns:1fr auto}.linkrow b{grid-column:1 / -1}}
  .steps{margin:6px 0 0;padding-left:20px;font-size:14px}
  .steps li{margin:4px 0}
  textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;min-height:150px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登入 -->
  <section id="loginView" class="login" hidden>
    <div class="card">
      <div class="cup">🧋</div>
      <h2>奶茶定位所後台</h2>
      <p class="sub" id="loginHint">輸入你在試算表選單「③ 設定網頁後台密碼」設定的密碼</p>
      <form id="loginForm">
        <div class="pw-wrap">
          <input class="input" type="password" id="pw" placeholder="後台密碼" autocomplete="current-password" required>
          <button type="button" class="eye" id="eyeBtn" aria-label="顯示密碼" title="顯示密碼">👁️</button>
        </div>
        <div style="margin-top:14px"><button class="btn" id="loginBtn">登入</button></div>
      </form>
      <p class="muted" id="loginMsg"></p>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="appView" hidden>
    <header>
      <div class="brand">🧋<div>奶茶定位所後台<small>ADMIN</small></div></div>
      <div class="row">
        <a class="btn ghost sm" href="./" target="_blank" rel="noopener" style="text-decoration:none">看網站 ↗</a>
        <details class="more" id="more">
          <summary class="btn ghost sm">⋯ 其他 ▾</summary>
          <div class="more-menu" id="moreMenu"></div>
        </details>
        <button class="btn ghost sm" id="themeBtn">🌗</button>
        <button class="btn ghost sm" id="logoutBtn">登出</button>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="dash">📊 儀表板</button>
      <button class="tab" data-tab="leads">👥 名單</button>
      <button class="tab" data-tab="seq">✉️ 序列信</button>
      <button class="tab" data-tab="products">🎁 課程產品</button>
      <button class="tab" data-tab="settings">⚙️ 寄信設定</button>
      <button class="tab" data-tab="site">🌐 網站設定</button>
    </nav>

    <div data-view="dash"></div>
    <div data-view="leads" hidden></div>
    <div data-view="seq" hidden></div>
    <div data-view="products" hidden></div>
    <div data-view="settings" hidden></div>
    <div data-view="site" hidden></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
(() => {
  const ENDPOINT = ((window.MILKTEA_CONFIG || {}).ENDPOINT || '').trim();
  const PERSONAS = ['知識導師','人氣主持人','美感創作者','療癒陪伴者','實驗紀錄家'];
  const STATUSES = ['訂閱中','已退訂','序列完成'];
  const VARS = ['{暱稱}','{人格}','{副口味}','{賽道1}','{賽道2}','{受眾}','{定位句}','{產品名稱}','{產品連結}','{課程卡片}'];
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const view = name => $(`[data-view="${name}"]`);
  let KEY = '';
  try { KEY = sessionStorage.getItem('mt-admin') || ''; } catch (e) {}
  try { const t = localStorage.getItem('mt-admin-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }

  async function api(action, extra = {}){
    const res = await fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({admin:true, key:KEY, action, ...extra})});
    const data = await res.json();
    if (data.auth === false) { logout(); throw new Error('密碼錯誤或已變更，請重新登入'); }
    if (!data.ok) throw new Error(data.error || '發生錯誤');
    return data;
  }
  async function busy(btn, fn){
    const txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 處理中';
    try { return await fn(); } catch (e) { toast('😢 ' + e.message); } finally { btn.disabled = false; btn.innerHTML = txt; }
  }

  // ---------- 登入 ----------
  function logout(){ KEY = ''; try { sessionStorage.removeItem('mt-admin'); } catch (e) {} $('#appView').hidden = true; $('#loginView').hidden = false; }
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!ENDPOINT) return;
    KEY = $('#pw').value;
    await busy($('#loginBtn'), async () => {
      try { await api('login'); }
      catch (err) { $('#loginMsg').textContent = '😢 ' + err.message; KEY = ''; return; }
      try { sessionStorage.setItem('mt-admin', KEY); } catch (e2) {}
      start();
    });
  });
  $('#eyeBtn').onclick = () => {
    const pw = $('#pw'), show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('#eyeBtn').classList.toggle('on', show);
    $('#eyeBtn').textContent = show ? '🙈' : '👁️';
    $('#eyeBtn').title = $('#eyeBtn').ariaLabel = show ? '隱藏密碼' : '顯示密碼';
    pw.focus();
  };
  $('#logoutBtn').onclick = logout;
  $('#themeBtn').onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('mt-admin-theme', r.dataset.theme); } catch (e) {}
  };

  // ---------- 分頁 ----------
  const loaded = {};
  const LOADERS = {dash: loadDash, leads: loadLeads, seq: loadSeq, products: loadProducts, settings: loadSettings, site: loadSite};
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    $$('.tab').forEach(t => t.classList.toggle('on', t === b));
    $$('[data-view]').forEach(v => v.hidden = v.dataset.view !== b.dataset.tab);
    if (!loaded[b.dataset.tab]) LOADERS[b.dataset.tab]();
  });
  const loading = name => { view(name).innerHTML = '<div class="card empty"><span class="spinner"></span> 載入中…</div>'; };
  const fail = (name, e) => { view(name).innerHTML = `<div class="card empty">😢 ${esc(e.message)}</div>`; };

  // ---------- 儀表板 ----------
  async function loadDash(){
    loading('dash'); loaded.dash = true;
    try {
      const d = await api('stats');
      const pmax = Math.max(1, ...Object.values(d.persona));
      const nicheTop = Object.entries(d.niche).sort((a,b) => b[1]-a[1]).slice(0, 6);
      const nmax = Math.max(1, ...nicheTop.map(x => x[1]));
      const days = [];
      for (let i = 13; i >= 0; i--) { const t = new Date(Date.now() - i*864e5); const k = String(t.getMonth()+1).padStart(2,'0') + '/' + String(t.getDate()).padStart(2,'0'); days.push([k, d.days[k] || 0]); }
      const dmax = Math.max(1, ...days.map(x => x[1]));
      view('dash').innerHTML = `
        ${mailBanner(d.mail)}
        <div class="grid g4" style="margin-bottom:16px">
          <div class="stat"><b>${d.total}</b><span>總名單</span></div>
          <div class="stat"><b>${d.week}</b><span>近 7 天新增</span></div>
          <div class="stat"><b>${d.active}</b><span>序列寄送中</span></div>
          <div class="stat"><b>${d.unsub}</b><span>已退訂</span></div>
        </div>
        <div class="card"><h3>📈 近 14 天新增名單</h3>
          <div class="spark" style="margin-bottom:22px">${days.map(([k,v]) => `<div style="height:${v/dmax*100}%" title="${k}：${v} 人"><span>${k.slice(3)}</span></div>`).join('')}</div>
        </div>
        <div class="grid g2">
          <div class="card"><h3>🧋 奶茶人格分布</h3>
            ${PERSONAS.map(p => `<div class="bar"><span>${p}</span><div class="t"><div class="v" style="width:${(d.persona[p]||0)/pmax*100}%"></div></div><span class="n">${d.persona[p]||0}</span></div>`).join('')}
          </div>
          <div class="card"><h3>🎯 最多人推薦的賽道</h3>
            ${nicheTop.length ? nicheTop.map(([k,v]) => `<div class="bar"><span>${esc(k)}</span><div class="t"><div class="v" style="width:${v/nmax*100}%"></div></div><span class="n">${v}</span></div>`).join('') : '<p class="muted">還沒有資料</p>'}
          </div>
          <div class="card"><h3>🧋 20 種特調分布</h3>
            ${barList(d.blend, 20, '名單裡還沒有特調資料（後台更新後新填的名單才會有）')}
          </div>
          <div class="card"><h3>📣 名單從哪裡來</h3>
            ${barList(d.source, 10, '還沒有資料（後台更新後新填的名單才會有）')}
          </div>
        </div>
        <div class="card"><h3>🔗 專屬追蹤連結</h3>
          <p class="sub">在不同地方分享不同的連結，上面的「名單從哪裡來」就會分開統計。好友分享的連結會自動記成「好友邀請」。</p>
          ${TRACK.map(([code, name]) => trackRow(name, code)).join('')}
          <div class="row" style="margin-top:10px"><input class="input" id="trackCode" placeholder="自訂代號，例如 1024講座" style="flex:1;min-width:180px"><button class="btn ghost sm" id="trackMake">產生連結</button></div>
          <div id="trackOut"></div>
        </div>`;
      $('#trackMake').onclick = () => {
        const c = $('#trackCode').value.trim(); if (!c) return toast('先輸入一個代號');
        $('#trackOut').innerHTML = trackRow(c, c);
      };
    } catch (e) { fail('dash', e); }
  }
  // ---------- 追蹤連結 ----------
  const SITE_URL = 'https://daxingcourse.github.io/self-media-positioning/';
  const TRACK = [['ig','Instagram'],['threads','Threads'],['fb','Facebook'],['line','LINE'],['yt','YouTube'],['class','課堂'],['email','電子報']];
  const trackRow = (name, code) => { const u = SITE_URL + '?src=' + encodeURIComponent(code); return `<div class="linkrow"><b>${esc(name)}</b><code>${esc(u)}</code><button class="btn ghost sm" data-copy="${esc(u)}">複製</button></div>`; };
  const barList = (obj, n, emptyText) => {
    const list = Object.entries(obj || {}).sort((a,b) => b[1]-a[1]).slice(0, n);
    const max = Math.max(1, ...list.map(x => x[1]));
    return list.length ? list.map(([k,v]) => `<div class="bar" style="grid-template-columns:150px 1fr 40px"><span>${esc(k)}</span><div class="t"><div class="v" style="width:${v/max*100}%"></div></div><span class="n">${v}</span></div>`).join('') : `<p class="muted">${esc(emptyText)}</p>`;
  };
  document.addEventListener('click', async e => {

          <div class="item ${m['啟用'] ? '' : 'off'}" data-i="${i}">

              <span class="pill">第 ${i+1} 封</span>
              <label class="muted">留 Email 後第 <input class="input num" type="number" min="0" max="365" data-k="第幾天寄" value="${esc(m['第幾天寄'])}" style="display:inline-block;width:70px;padding:4px 8px"> 天寄</label>

            <label class="f">內文</label>
            <div class="vars">${VARS.map(v => `<button type="button" data-var="${v}">${v}</button>`).join('')}</div>
            <textarea class="input" data-k="內文">${esc(m['內文'])}</textarea>
          </div>`).join('') || '<p class="empty">還沒有序列信</p>'}</div>

      </div>`;
    const list = $('#seqList');
    list.addEventListener('input', e => {
      const el = e.target.closest('[data-k]'); if (!el) return;
      const i = +el.closest('.item').dataset.i;
      SEQ[i][el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'checkbox') el.closest('.item').classList.toggle('off', !el.checked);
    });
    list.addEventListener('click', async e => {
      const v = e.target.closest('[data-var]');
      if (v) { const ta = $('textarea', v.closest('.item')); insertAt(ta, v.dataset.var); ta.dispatchEvent(new Event('input', {bubbles:true})); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      const i = +b.closest('.item').dataset.i;
      if (b.dataset.act === 'del') { if (confirm('確定刪除這封信？（按儲存後生效）')) { SEQ.splice(i,1); renum(); renderSeq(); } }
      if (b.dataset.act === 'up' && i > 0) { [SEQ[i-1], SEQ[i]] = [SEQ[i], SEQ[i-1]]; renum(); renderSeq(); }
      if (b.dataset.act === 'down' && i < SEQ.length-1) { [SEQ[i+1], SEQ[i]] = [SEQ[i], SEQ[i+1]]; renum(); renderSeq(); }
      if (b.dataset.act === 'test') {
        const to = prompt('寄測試信到哪個 Email？（會先用「已儲存」的版本寄出）', localStorage.getItem('mt-admin-test') || '');
        if (!to) return;

    $('#addSeq').onclick = () => {
      const last = SEQ[SEQ.length-1];
      SEQ.push({'順序': SEQ.length+1, '第幾天寄': last ? (+last['第幾天寄']||0) + 3 : 1, '主旨': '', '內文': '嗨 {暱稱}，\n\n', '啟用': true});

  const renum = () => SEQ.forEach((m,i) => m['順序'] = i+1);
  function insertAt(ta, text){
    const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;

        </div>`;
      let provider = String(s['寄信方式'] || 'resend').toLowerCase();
      $('#provider').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; provider = c.dataset.v; $$('#provider .chip').forEach(x => x.classList.toggle('on', x === c)); });
      $('#saveKey').onclick = e => busy(e.currentTarget, async () => {
        const k = $('#rkey').value.trim(); if (!k) throw new Error('請貼上金鑰');
        await api('setResendKey', {resendKey: k}); $('#rkey').value = ''; toast('金鑰已更新 🔑'); loadSettings();
      });
      $('#saveSettings').onclick = e => busy(e.currentTarget, async () => {
        const map = {'寄信方式': provider};
        $$('[data-s]').forEach(el => map[el.dataset.s] = el.value.trim());
        if (provider === 'resend' && !map['寄件信箱']) throw new Error('用 Resend 時一定要填寄件信箱');
        await api('saveSettings', {settings: map}); toast('設定已儲存 ✅'); loaded.dash = false;
      });
      $('#testAll').onclick = e => busy(e.currentTarget, async () => {
        const to = $('#testTo').value.trim(); try { localStorage.setItem('mt-admin-test', to); } catch (err) {}
        await api('testSend', {to}); toast('測試信寄出了，去信箱看看 💌');
      });
      $('#runQueue').onclick = e => busy(e.currentTarget, async () => { await api('runQueue'); toast('已處理寄信佇列 ✅'); loaded.leads = false; });
    } catch (e) { fail('settings', e); }
  }

  // ---------- 網站設定：LINE、Google AdSense ----------
  const AD_SLOTS = [['home','首頁下方'],['result-mid','結果頁中間（賽道推薦後）'],['result-end','結果頁最下方']];
  async function loadSite(){
    loading('site'); loaded.site = true;
    try {
      const {settings: s, v} = await api('getSettings');
      const on = (k, def) => s[k] === undefined || s[k] === '' ? def : s[k] === true || String(s[k]).toUpperCase() === 'TRUE';
      const slots = String(s['廣告位置'] || 'result-mid,result-end').split(/[,，\s]+/);
      view('site').innerHTML = `
        ${(v || 0) < 2 ? `<div class="card" style="padding:12px 16px;border-color:var(--warn)"><span class="pill warn">● 後台程式還沒更新</span> <span class="muted">這頁的設定可以先存，但要把新版 Code.gs 貼到 Apps Script 並「部署成新版本」後，網站才會套用。</span></div>` : ''}
        <div class="card">
          <h3>💚 LINE 官方帳號</h3>
          <p class="sub">開啟後，結果頁會出現「加入 LINE 官方帳號」按鈕，每封信底部也會有加入按鈕。</p>
          <label class="switch"><input type="checkbox" id="lineOn" ${on('LINE 按鈕', true) ? 'checked' : ''}><i></i>顯示 LINE 按鈕</label>
          <label class="f">LINE ID<span class="h">@ 開頭，例如 @764bdtsz</span></label>
          <div class="row"><input class="input" id="lineId" value="${esc(s['LINE 官方帳號'] || '@764bdtsz')}" style="flex:1;min-width:180px"><a class="btn ghost sm" id="lineTest" target="_blank" rel="noopener" style="text-decoration:none">測試連結 ↗</a></div>
        </div>
        <div class="card">
          <h3>💰 Google AdSense 廣告</h3>
          <p class="sub">把 AdSense 給你的廣告代碼貼在下面、打開開關、按儲存，約 1 分鐘後網站就會出現廣告。想暫停時把開關關掉再儲存即可，代碼會保留。</p>
          <label class="switch"><input type="checkbox" id="adsOn" ${on('廣告開關', false) ? 'checked' : ''}><i></i>在網站顯示廣告</label>
          <label class="f">廣告代碼<span class="h">從 AdSense「廣告 → 依廣告單元」複製整段（含 &lt;script&gt;），最多 5000 字</span></label>
          <textarea class="input code" id="adCode" spellcheck="false" placeholder="&lt;script async src=&quot;https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-…&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;
&lt;ins class=&quot;adsbygoogle&quot; …&gt;&lt;/ins&gt;
&lt;script&gt;(adsbygoogle = window.adsbygoogle || []).push({});&lt;/script&gt;">${esc(s['廣告代碼'] || '')}</textarea>
          <label class="f">廣告要放在哪裡<span class="h">可以複選；測驗作答中不會出現廣告，避免影響填答</span></label>
          <div class="chips" id="adSlots">${AD_SLOTS.map(([k, l]) => `<button type="button" class="chip ${slots.includes(k) ? 'on' : ''}" data-v="${k}">${l}</button>`).join('')}</div>
          <div class="savebar"><button class="btn" id="saveSite">💾 儲存網站設定</button></div>
        </div>
        <div class="card">
          <h3>📋 第一次申請 AdSense 要做的事</h3>
          <ol class="steps">
            <li>到 <a href="https://adsense.google.com" target="_blank" rel="noopener">adsense.google.com</a> 用 Google 帳號申請，「網站」填你的網址。</li>
            <li>AdSense 只接受<b>你自己擁有的網域</b>：daxingcourse.github.io 是 GitHub 的網域，通常無法通過審核，建議先把測驗網站換成 <b>quiz.daxingcourse.com</b> 這類自己的子網域（可以請 Claude 幫你設定）。</li>
            <li>AdSense 會給你一組 <code>ca-pub-</code> 開頭的發布商 ID，把它交給 Claude，幫你加上網站驗證碼和 ads.txt。</li>
            <li>審核通過（通常幾天到 2 週）後，在 AdSense 建立「多媒體廣告」單元，把代碼貼到上面、打開開關。</li>
            <li>網站已經放好<a href="${SITE_URL}privacy.html" target="_blank" rel="noopener">隱私權政策</a>，這是 AdSense 審核必備的。</li>
          </ol>
        </div>`;
      const syncLine = () => { $('#lineTest').href = 'https://line.me/R/ti/p/' + encodeURIComponent(($('#lineId').value.trim().replace(/^@?/, '@'))); };
      $('#lineId').addEventListener('input', syncLine); syncLine();
      $('#adSlots').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) c.classList.toggle('on'); });
      $('#saveSite').onclick = e => busy(e.currentTarget, async () => {
        const code = $('#adCode').value.trim(), adsOn = $('#adsOn').checked;
        const lineId = $('#lineId').value.trim().replace(/^(?!@|https?:)/, '@');
        if (adsOn && !code) throw new Error('要先貼上廣告代碼，才能打開廣告');
        if (code.length > 5000) throw new Error('廣告代碼太長了（最多 5000 字）');
        if (code && !/adsbygoogle|googlesyndication/.test(code)) { if (!confirm('這段代碼看起來不像 Google AdSense 的代碼，確定要儲存嗎？')) return; }
        const pos = $$('#adSlots .chip.on').map(c => c.dataset.v);
        if (adsOn && !pos.length) throw new Error('至少選一個廣告位置');
        await api('saveSettings', {settings: {
          'LINE 官方帳號': lineId === '@' ? '' : lineId, 'LINE 按鈕': $('#lineOn').checked ? 'TRUE' : 'FALSE',
          '廣告開關': adsOn ? 'TRUE' : 'FALSE', '廣告代碼': code, '廣告位置': pos.join(','),
        }});
        toast('網站設定已儲存 ✅ 約 1 分鐘後生效');
      });
    } catch (e) { fail('site', e); }
  }

  // ---------- 啟動 ----------
  function start(){
    $('#loginView').hidden = true; $('#appView').hidden = false;
    Object.keys(loaded).forEach(k => delete loaded[k]);
    loadDash();
  }
  if (!ENDPOINT) {
    $('#loginView').hidden = false;
    $('#loginHint').innerHTML = '⚠️ 還沒設定後台網址。<br>請先完成 <b>backend/後台設定教學.md</b>，再把網址填進 <b>config.js</b>。';
    $('#loginForm').hidden = true;
  } else if (KEY) start();
  else $('#loginView').hidden = false;
})();
</script>
</body>
</html>
