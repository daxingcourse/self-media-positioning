<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶茶定位所｜自媒體定位系統</title>
<meta name="description" content="用一杯奶茶的時間，測出你的創作者特質、奶茶人格與最適合的自媒體方向。">
<meta name="theme-color" content="#E9D8C4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E9D8C4'/%3E%3Cpath d='M18 20h28l-4 34H22z' fill='%23C8A27C'/%3E%3Ccircle cx='27' cy='46' r='3' fill='%234A3226'/%3E%3Ccircle cx='35' cy='48' r='3' fill='%234A3226'/%3E%3Ccircle cx='31' cy='42' r='3' fill='%234A3226'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5EC;
    --foam:#F5EADB;
    --milk:#EBDCC8;
    --tea:#D9BC9A;
    --caramel:#C08B5C;
    --brown:#8A5E3F;
    --pearl:#4A3226;
    --ink:#3B2A20;
    --muted:#8E7766;
    --card:#FFFDF9;
    --line:#E6D3BD;
    --pink:#F2C6C2;
    --matcha:#CFDDB7;
    --taro:#D9C8E6;
    --shadow:0 6px 0 #E2CDB3;
    --boba:#4A3226;
    --shadow-sm:0 3px 0 #E2CDB3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#231A15; --foam:#2C211B; --milk:#3A2C23; --tea:#6B4E3A; --caramel:#D9A274;
      --brown:#E6C2A0; --pearl:#F3E3D0; --ink:#F6EBDD; --muted:#BFA48E; --card:#2F241D;
      --line:#4A372B; --pink:#6E4846; --matcha:#4C5A3C; --taro:#54476A;
      --shadow:0 6px 0 #160F0B; --shadow-sm:0 3px 0 #160F0B; --boba:#1E120C;
    }
  }
  :root[data-theme="dark"]{
    --cream:#231A15; --foam:#2C211B; --milk:#3A2C23; --tea:#6B4E3A; --caramel:#D9A274;
    --brown:#E6C2A0; --pearl:#F3E3D0; --ink:#F6EBDD; --muted:#BFA48E; --card:#2F241D;
    --line:#4A372B; --pink:#6E4846; --matcha:#4C5A3C; --taro:#54476A;
    --shadow:0 6px 0 #160F0B; --shadow-sm:0 3px 0 #160F0B; --boba:#1E120C;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Noto Sans TC',system-ui,sans-serif;
    background:var(--cream);
    background-image:radial-gradient(circle at 12% 8%,var(--foam) 0 180px,transparent 181px),
                     radial-gradient(circle at 92% 30%,var(--foam) 0 140px,transparent 141px);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.65;
  }
  .cute{font-family:'Huninn','Noto Sans TC',sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea{font:inherit;color:var(--ink)}

  /* floating pearls */
  .pearls{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .pearls i{position:absolute;bottom:-40px;border-radius:50%;background:var(--pearl);opacity:.08;animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh) translateX(20px)}}

  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 120px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--brown)}
  .brand small{display:block;font-size:11px;color:var(--muted);font-family:'Noto Sans TC';letter-spacing:.12em}
  .icon-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .15s}
  .icon-btn:hover{transform:rotate(-12deg) scale(1.06)}

  /* progress cup */
  .progress{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:10px 16px;background:var(--card);border:2px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm)}
  .progress[hidden]{display:none}
  .progress .bar{flex:1;height:14px;border-radius:99px;background:var(--foam);overflow:hidden;position:relative}
  .progress .fill{height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(90deg,var(--caramel) 0 14px,var(--tea) 14px 28px);transition:width .5s cubic-bezier(.34,1.56,.64,1);animation:slide 1.2s linear infinite}
  @keyframes slide{to{background-position:28px 0}}
  .progress .lbl{font-size:13px;color:var(--muted);white-space:nowrap}

  .card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px 24px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .step{display:none}
  .step.on{display:block}
  h1,h2,h3{margin:0;font-family:'Huninn','Noto Sans TC',sans-serif;font-weight:400;color:var(--brown);line-height:1.35}
  h1{font-size:clamp(28px,6vw,40px)}
  h2{font-size:24px;margin-bottom:6px}
  h3{font-size:18px;margin-bottom:10px}
  .sub{color:var(--muted);margin:6px 0 22px;font-size:15px}
  .tag{display:inline-block;font-size:12px;padding:3px 12px;border-radius:99px;background:var(--milk);color:var(--brown);margin-bottom:10px;letter-spacing:.06em}

  .field{margin-bottom:22px}
  .field > label{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
  .field .hint{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .input{width:100%;padding:13px 16px;border-radius:18px;border:2px solid var(--line);background:var(--cream);outline:none;transition:border-color .15s, box-shadow .15s}
  .input:focus{border-color:var(--caramel);box-shadow:0 0 0 4px color-mix(in srgb,var(--caramel) 20%,transparent)}
  textarea.input{min-height:84px;resize:vertical}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:2px solid var(--line);background:var(--cream);border-radius:99px;padding:8px 15px;font-size:14px;transition:transform .15s, background .15s, border-color .15s}
  .chip:hover{transform:translateY(-2px)}
  .chip.on{background:var(--caramel);border-color:var(--caramel);color:#fff;animation:jelly .4s}
  @keyframes jelly{30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.05)}100%{transform:none}}

  .btns{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{border:2px solid var(--pearl);background:var(--caramel);color:#fff;padding:12px 26px;border-radius:99px;font-weight:700;box-shadow:0 4px 0 var(--pearl);transition:transform .1s, box-shadow .1s;font-size:15px}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--pearl)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pearl)}
  .btn.ghost{background:var(--card);color:var(--brown);border-color:var(--line);box-shadow:var(--shadow-sm)}
  .btn:disabled{opacity:.45;pointer-events:none}
  .btn.big{font-size:18px;padding:15px 38px}

  /* hero */
  .hero{text-align:center;padding:34px 22px}
  .mascot{width:150px;height:auto;display:block;margin:0 auto 10px;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
  .mascot .blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 28px}
  .menu div{background:var(--foam);border-radius:20px;padding:14px 6px;font-size:13px;color:var(--brown)}
  .menu b{display:block;font-size:22px;margin-bottom:2px}
  @media (max-width:520px){.menu{grid-template-columns:repeat(2,1fr)}}

  /* quiz */
  .q-count{font-size:13px;color:var(--muted)}
  .q-title{font-size:22px;margin:6px 0 20px}
  .opts{display:grid;gap:12px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--cream);border-radius:20px;padding:14px 16px;transition:transform .15s, border-color .15s, background .15s;font-size:15px}
  .opt:hover{transform:translateX(4px);border-color:var(--tea)}
  .opt .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--milk);display:grid;place-items:center;font-weight:700;color:var(--brown);font-size:13px}
  .opt.on{background:var(--milk);border-color:var(--caramel)}
  .opt.on .dot{background:var(--pearl);color:var(--cream)}
  .pearl-row{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .pearl-row span{width:12px;height:12px;border-radius:50%;background:var(--milk);transition:background .2s, transform .2s}
  .pearl-row span.done{background:var(--pearl)}
  .pearl-row span.cur{transform:scale(1.4);background:var(--caramel)}

  /* loading */
  .brewing{text-align:center;padding:60px 20px}
  .brewing p{color:var(--muted)}
  .shake{display:inline-block;animation:shake .5s ease-in-out infinite}
  @keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

  /* result */
  .persona{text-align:center;padding:30px 22px;position:relative;overflow:hidden}
  .persona .cup{width:140px;display:block;margin:0 auto;overflow:visible}
  .persona .tag{display:table;margin:0 auto 6px}
  .mascot-stage{position:relative;width:220px;height:200px;margin:4px auto 0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
  .mascot-stage .cup-wrap{position:absolute;left:50%;bottom:0;width:140px;margin-left:-70px;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-6px)}}
  .cup-wrap.boing{animation:boing .6s cubic-bezier(.34,1.56,.64,1)}
  @keyframes boing{0%{transform:scale(1)}20%{transform:scale(1.18,.8)}45%{transform:scale(.9,1.15) translateY(-26px)}70%{transform:scale(1.05,.95)}100%{transform:scale(1)}}
  .cup-wrap.spin{animation:spin .9s cubic-bezier(.34,1.56,.64,1)}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .cup .straw{transform-origin:98px 70px;transform-box:view-box;animation:straw 2.4s ease-in-out infinite}
  @keyframes straw{50%{transform:rotate(-6deg)}}
  .cup .pb{transform-box:fill-box;transform-origin:center;animation:pb 1.8s ease-in-out infinite}
  .cup .pb:nth-child(2){animation-delay:.25s}.cup .pb:nth-child(3){animation-delay:.5s}.cup .pb:nth-child(4){animation-delay:.75s}.cup .pb:nth-child(5){animation-delay:1s}
  @keyframes pb{50%{transform:translateY(-6px)}}
  .cup-wrap.boing .pb{animation:pjump .6s ease-out}
  @keyframes pjump{40%{transform:translateY(-22px)}}
  .cup .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
  .cup .pupils{transition:transform .12s ease-out}
  .cup .blush{transition:opacity .2s;opacity:.75}
  .cup-wrap.happy .blush{opacity:1}
  .cup .mouth-o{display:none}
  .cup-wrap.happy .mouth-smile{display:none}
  .cup-wrap.happy .mouth-o{display:inline}
  .cup-wrap.happy .eyes{display:none}
  .cup .happy-eyes{display:none}
  .cup-wrap.happy .happy-eyes{display:inline}
  .speech{position:relative;display:inline-block;max-width:min(320px,90%);margin:6px auto 2px;background:var(--cream);border:2px solid var(--line);border-radius:18px;padding:8px 16px;font-size:14.5px;color:var(--brown);font-family:'Huninn','Noto Sans TC',sans-serif;box-shadow:var(--shadow-sm);min-height:40px}
  .speech::after{content:'';position:absolute;left:50%;bottom:-9px;width:14px;height:14px;margin-left:-7px;background:var(--cream);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
  .speech.pop{animation:jelly .4s}
  .poke-hint{font-size:12px;color:var(--muted);margin-top:4px;animation:hint 1.6s ease-in-out infinite}
  @keyframes hint{50%{transform:translateY(-3px);opacity:.6}}
  .floaty{position:absolute;pointer-events:none;font-size:20px;animation:floaty 1.4s ease-out forwards;z-index:3}
  @keyframes floaty{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-110px) scale(1.2) rotate(var(--rot))}}
  .ambient{position:absolute;bottom:-20px;pointer-events:none;border-radius:50%;opacity:.35;animation:ambient linear infinite}
  @keyframes ambient{to{transform:translateY(-420px)}}
  .persona > *:not(.ambient){position:relative;z-index:1}
  .persona .name{font-size:clamp(26px,6vw,34px);margin:6px 0 4px}
  .persona .slogan{color:var(--muted);font-size:15px}
  .persona .blend-title{font-family:'Huninn',sans-serif;color:var(--caramel);font-size:clamp(18px,4.5vw,22px);margin:-2px 0 6px}
  .recipe{display:flex;align-items:stretch;justify-content:center;gap:6px;margin-top:14px}
  .rpart{flex:1 1 0;min-width:0;max-width:220px;text-align:center;background:var(--foam);border-radius:18px;padding:12px 8px}
  .rpart b{display:block;font-size:14px;margin-top:6px}
  .rpart span:not(.rcup){display:block;font-size:12.5px;color:var(--muted)}
  .rplus{align-self:center}
  @media (max-width:520px){.rpart{padding:10px 5px;border-radius:14px}.rpart b{font-size:12.5px}.rpart span:not(.rcup){font-size:11px}.rcup{width:24px;height:29px}.rplus{font-size:16px}}
  .rpart.result{border:2px solid var(--caramel)}
  .recipe .rpart span.rlabel{display:block;font-size:11.5px;color:var(--caramel);font-weight:700;margin-bottom:4px}
  .rcup{display:inline-block;width:30px;height:36px;border-radius:4px 4px 10px 10px;border:2.5px solid #8A5E3F}
  .rplus{font-family:'Huninn',sans-serif;font-size:22px;color:var(--caramel)}
  .perk{background:var(--foam);border-radius:18px;padding:12px 14px}
  .perk h3{font-size:15px;margin:0 0 4px}
  .perk p{margin:0;font-size:14px}
  .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .badge{background:var(--foam);color:var(--brown);border-radius:99px;padding:5px 13px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:620px){.grid2{grid-template-columns:1fr}}
  .section{margin-top:18px}
  .radar svg{width:100%;max-width:330px;display:block;margin:0 auto}
  .bars .row{display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
  .bars .track{height:12px;background:var(--foam);border-radius:99px;overflow:hidden}
  .bars .val{height:100%;border-radius:99px;background:var(--caramel);width:0;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
  .bars .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  ul.clean{list-style:none;padding:0;margin:0}
  ul.clean li{padding:7px 0 7px 26px;position:relative}
  ul.clean li::before{content:'';position:absolute;left:4px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--pearl)}
  ul.clean.warn li::before{background:var(--pink);border:2px solid var(--caramel)}
  .dir{border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;background:var(--cream);position:relative}
  .dir.top1{border-color:var(--caramel);background:color-mix(in srgb,var(--milk) 55%,var(--cream))}
  .dir .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .dir .head h3{margin:0}
  .match{font-size:13px;font-weight:700;color:#fff;background:var(--caramel);border-radius:99px;padding:3px 12px;white-space:nowrap}
  .dir p{margin:6px 0;font-size:14.5px}
  .mini{font-size:13px;color:var(--muted)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  @media (max-width:520px){.pillars{grid-template-columns:1fr}}
  .pillar{background:var(--foam);border-radius:16px;padding:12px;font-size:13.5px}
  .pillar b{display:block;color:var(--brown);margin-bottom:4px}
  .statement{background:var(--pearl);color:var(--cream);border-radius:24px;padding:22px;font-size:17px;line-height:1.8;position:relative}
  .statement .q{font-family:'Huninn';font-size:44px;line-height:0;position:relative;top:16px;margin-right:4px;opacity:.5}
  .bio{background:var(--cream);border:2px dashed var(--tea);border-radius:18px;padding:14px 16px;font-size:14.5px;white-space:pre-line;margin-top:10px}
  .ideas li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .ideas{padding-left:20px;margin:0}
  .plan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
  .plan div{background:var(--foam);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;min-height:66px}
  .plan div b{display:block;color:var(--brown);font-size:12px}
  .plan div.on{background:var(--milk);border:2px solid var(--caramel)}
  @media (max-width:520px){.plan{grid-template-columns:repeat(4,1fr)}}
  .mail-card{background:linear-gradient(135deg,var(--milk),var(--foam))}
  .mail-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .mail-row .input{flex:1 1 220px;background:var(--card)}
  .consent{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:12px;cursor:pointer}
  .consent input{margin-top:3px;accent-color:var(--caramel);width:16px;height:16px;flex:none}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .mail-done{display:none;text-align:center;padding:10px 0}
  .mail-card.sent form{display:none}
  .mail-card.sent .mail-done{display:block;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  .mail-msg{font-size:13px;margin-top:8px;min-height:1em;color:var(--brown)}
  .prod{border:2px solid var(--caramel);border-radius:22px;padding:18px;background:var(--cream);margin-top:12px}
  .prod h3{margin:0 0 4px}
  .prod .price{color:var(--muted);font-size:13px;margin:4px 0 10px}
  .prod a.btn{display:inline-block;text-decoration:none}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);background:var(--pearl);color:var(--cream);padding:11px 22px;border-radius:99px;z-index:9;transition:transform .35s cubic-bezier(.34,1.56,.64,1);font-size:14px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
  .confetti i{position:absolute;top:-20px;width:12px;height:12px;border-radius:50%;animation:fall 2.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  /* ---------- 浮動分享按鈕 ---------- */
  .share-fab{position:fixed;right:18px;bottom:22px;z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
  .share-fab[hidden]{display:none}
  .share-fab > *{pointer-events:auto}
  .fab-main{position:relative;width:64px;height:64px;border-radius:50%;border:3px solid var(--pearl);background:var(--caramel);box-shadow:0 5px 0 var(--pearl);display:grid;place-items:center;animation:fabBob 2.4s ease-in-out infinite;transition:transform .2s}
  .fab-main:active{transform:translateY(3px)}
  .fab-main::before,.fab-main::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--caramel);animation:fabRing 2.4s ease-out infinite;pointer-events:none}
  .fab-main::after{animation-delay:1.2s}
  @keyframes fabBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  @keyframes fabRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  .fab-main .ico{font-size:28px;line-height:1;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .fab-main .x{position:absolute;font-size:26px;color:#fff;font-weight:700;opacity:0;transform:rotate(-90deg) scale(.4);transition:all .35s cubic-bezier(.34,1.56,.64,1)}
  .share-fab.open .fab-main{animation:none}
  .share-fab.open .fab-main::before,.share-fab.open .fab-main::after{display:none}
  .share-fab.open .fab-main .ico{transform:rotate(90deg) scale(0)}
  .share-fab.open .fab-main .x{opacity:1;transform:none}

  function analyze(){
    const raw = Object.fromEntries(TKEYS.map(k=>[k,0]));
    S.answers.forEach((a,i) => { if (a!=null && QUIZ[i]) raw[QUIZ[i].o[a][1]]++; });
    const score = Object.fromEntries(TKEYS.map(k => [k, Math.round(30 + 70 * raw[k] / TRAIT_MAX[k])]));
    const ranked = [...TKEYS].sort((a,b) => score[b]-score[a] || raw[b]-raw[a]);
    const norm = Object.fromEntries(TKEYS.map(k => [k, raw[k]/TRAIT_MAX[k]]));
    const dirs = NICHES.map(n => {
      const wsum = Object.values(n.w).reduce((a,b)=>a+b,0);
      const fit = Object.entries(n.w).reduce((a,[k,w]) => a + w*norm[k], 0) / wsum;
      const liked = S.interests.includes(n.id);
      const pct = Math.min(98, Math.round(42 + fit*40 + (liked?18:0)));
      return {...n, fit, liked, pct};
    }).sort((a,b) => b.pct-a.pct);
    // ensure at least one liked niche appears in top 3
    const top = dirs.slice(0,3);
    if (!top.some(d=>d.liked)){ const l = dirs.find(d=>d.liked); if (l) top[2] = l; }
    return {score, ranked, top};

  function radarSVG(score){

    let rings = '';
    [0.25,0.5,0.75,1].forEach(f => {

    });
    const axes = TKEYS.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/>`;}).join('');
    const poly = TKEYS.map((k,i)=>pt(i,R*score[k]/100).join(',')).join(' ');
    const dots = TKEYS.map((k,i)=>{const [x,y]=pt(i,R*score[k]/100);return `<circle cx="${x}" cy="${y}" r="6" fill="var(--pearl)"/>`;}).join('');

    return `<svg viewBox="0 0 300 285" role="img" aria-label="五大創作者特質雷達圖">${rings}${axes}

        <animate attributeName="opacity" from="0" to="1" dur=".8s"/></polygon>${dots}${labels}</svg>`;
  }

  const FLOATIES = ['💗','✨','🫧','⭐','🧋','💛'];
  let mascotCleanup = null;
  function setupMascot(main, nick, drink, extra = []){
    const lines = [...POKE_LINES[main], ...extra];
    if (mascotCleanup) mascotCleanup();
    const stage = $('#mascot'), wrap = $('.cup-wrap', stage), speech = $('#speech'), card = stage.closest('.persona');
    const pupils = $('.pupils', stage);
    let pokes = 0, last = -1, talkT, moodT;
    const say = txt => { speech.textContent = txt; speech.classList.remove('pop'); void speech.offsetWidth; speech.classList.add('pop'); };
    const pick = arr => { let k; do { k = Math.floor(Math.random()*arr.length); } while (arr.length > 1 && k === last); last = k; return arr[k]; };
    const burst = (x, y, n) => {
      for (let i=0;i<n;i++){
        const f = document.createElement('span');
        f.className = 'floaty'; f.textContent = FLOATIES[Math.floor(Math.random()*FLOATIES.length)];
        f.style.left = (x - 10) + 'px'; f.style.top = (y - 10) + 'px';
        f.style.setProperty('--dx', (Math.random()*120-60) + 'px');
        f.style.setProperty('--rot', (Math.random()*60-30) + 'deg');
        f.style.animationDelay = (i*0.06) + 's';
        stage.appendChild(f); setTimeout(() => f.remove(), 1700);
      }
    };
    say(`嗨 ${nick}！我是你的${drink}～`);
    const poke = e => {
      pokes++;
      const r = stage.getBoundingClientRect();
      const x = e && e.clientX ? e.clientX - r.left : r.width/2, y = e && e.clientY ? e.clientY - r.top : r.height/2;
      const cls = pokes % 10 === 0 ? 'spin' : 'boing';
      wrap.classList.remove('boing','spin'); void wrap.offsetWidth; wrap.classList.add(cls, 'happy');
      clearTimeout(moodT); moodT = setTimeout(() => wrap.classList.remove('happy'), 900);
      burst(x, y, cls === 'spin' ? 10 : 4);
      if (pokes % 10 === 0) say(`哇！你已經戳我 ${pokes} 下了，轉個圈給你看 🌀`);
      else if (pokes % 4 === 0) say(pick(SHY_LINES));
      else say(pick(lines));
      $('#pokeHint').textContent = `已經戳了 ${pokes} 下 💗`;
    };
    stage.addEventListener('click', poke);
    stage.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });
    // 眼睛跟著游標／手指
    const look = e => {
      const pt = e.touches ? e.touches[0] : e;
      const r = wrap.getBoundingClientRect();
      const dx = pt.clientX - (r.left + r.width/2), dy = pt.clientY - (r.top + r.height*0.55);
      const d = Math.hypot(dx, dy) || 1, m = Math.min(1, d/220);
      pupils.style.transform = `translate(${(dx/d*3.2*m).toFixed(2)}px, ${(dy/d*3.2*m).toFixed(2)}px)`;
    };
    window.addEventListener('pointermove', look, {passive:true});
    window.addEventListener('touchmove', look, {passive:true});
    // 閒置時自己找話題
    talkT = setInterval(() => { if (document.visibilityState === 'visible') say(pick(lines)); }, 7000);
    // 背景緩緩上升的泡泡
    for (let i=0;i<10;i++){
      const b = document.createElement('i');
      const sz = 8 + Math.random()*18;
      b.className = 'ambient';
      Object.assign(b.style,{left:Math.random()*100+'%',width:sz+'px',height:sz+'px',background:i%2?'var(--tea)':'var(--pink)',animationDuration:(7+Math.random()*7)+'s',animationDelay:(-Math.random()*10)+'s'});
      card.prepend(b);
    }
    mascotCleanup = () => {
      clearInterval(talkT); clearTimeout(moodT);
      window.removeEventListener('pointermove', look);
      window.removeEventListener('touchmove', look);
    };
  }

    else if (face.startsWith('只出')) list.push('Podcast 或配音短影音（畫面用素材/錄螢幕）');
    else list.push(main==='create' ? 'IG / 小紅書 圖文輪播' : 'Threads 短文 + IG 圖卡');

    if (main==='act') list.push('YouTube Vlog 系列，記錄完整歷程');
    const freq = time.startsWith('3 小時內') ? '每週 2 篇（1 主力 + 1 輕量）' : time.startsWith('3–7') ? '每週 3–4 篇' : '每週 5 篇以上，可加開系列企劃';
    return {list, freq};

  function weekPlan(time, pillars){
    const days = ['一','二','三','四','五','六','日'];
    const on = time.startsWith('3 小時內') ? [1,4] : time.startsWith('3–7') ? [0,2,4,6] : [0,1,2,3,4,6];
    let p = 0;
    return days.map((d,i) => {
      if (!on.includes(i)) return `<div><b>週${d}</b>休息 ☕</div>`;
      const label = pillars[p++ % pillars.length];
      return `<div class="on"><b>週${d}</b>${esc(label)}</div>`;
    }).join('');
  }

      `## 天賦`, ...[B.power, ...P.strengths, P2.strengths[0]].map(s=>`- ${s}`), '',
      `## 注意事項`, ...P.blind.map(s=>`- ${s}`), '',
      `## 適合方向`, ...top.map((d,i)=>`${i+1}. ${d.name}（契合 ${d.pct}%）— 支柱：${d.pillars.join('、')}；形式：${d.forms}；變現：${d.monetize}`), '',
      `## 一句話定位`, statement, '',
      `## 社群簡介`, bio, '',
      `## 平台與頻率`, ...plat.list.map(s=>`- ${s}`), `- 頻率：${plat.freq}`, '',
      `## 選題靈感`, ...ideaList.map((t,i)=>`${i+1}. ${t}`),
    ].join('\n');
    const reportMd = () => REPORT_MD;

    $('#retake').onclick = () => { S.answers = []; S.qi = 0; save(); go(2); };
    $('#copyBtn').onclick = async () => {
      try { await navigator.clipboard.writeText(reportMd()); toast('已複製報告 🧋'); }
      catch(e){ toast('複製失敗，請改用下載'); }
    };
    $('#shareBtn').onclick = () => { setFab(true); fabMain.focus(); };
    $('#printBtn').onclick = () => window.print();
  }
  // ---------- 寄送報告＋收名單（送到 Google Apps Script 後台）----------
  function setupLeadCapture(payload){
    const card = $('#mailCard'), form = $('#mailForm'), msg = $('#mailMsg'), btn = $('#mailBtn');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('#mailInput').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.textContent = '😢 Email 格式好像怪怪的，再檢查一下～'; return; }
      if (!$('#mailConsent').checked) { msg.textContent = '☝️ 勾選同意後才能寄給你喔'; return; }
      btn.disabled = true; btn.textContent = '寄送中…'; msg.textContent = '';
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},   // 用 text/plain 避免跨網域預檢
          body: JSON.stringify({...payload, email, consent: true, hp: $('#mailHp').value, source: location.href}),
        });
        const data = await res.json().catch(() => ({}));
        if (!data.ok) throw new Error(data.error || '寄送失敗，請稍後再試');
        S.email = email; S.sentTo = email; save();
        $('#mailSentTo').textContent = email;
        card.classList.add('sent'); confetti(); toast('報告寄出囉 💌');
      } catch (err) {
        msg.textContent = '😢 ' + (err.message || '寄送失敗，請稍後再試');
      } finally {
        btn.disabled = false; btn.textContent = '寄給我 🧋';
      }
    });
    $('#mailConsent').addEventListener('change', () => { msg.textContent = ''; });
    $('#mailAgain').addEventListener('click', e => { e.preventDefault(); S.sentTo = ''; save(); card.classList.remove('sent'); });
    loadProducts(payload.persona);
  }

  async function loadProducts(persona){
    try {
      const res = await fetch(ENDPOINT + (ENDPOINT.includes('?') ? '&' : '?') + 'action=products');
      const data = await res.json();
      const fits = p => String(p.personas || '全部').split(/[,，、\s]+/).some(t => t === '全部' || (t && persona.includes(t)));
      const list = (data.products || []).filter(fits).slice(0, 2);
      if (!list.length) return;
      $('#prodList').innerHTML = list.map(p => `
        <div class="prod">
          <h3>${esc(p.name)}</h3>
          <div>${esc(p.desc)}</div>
          ${p.price ? `<div class="price">${esc(p.price)}</div>` : '<div style="height:10px"></div>'}
          ${/^https?:\/\//.test(p.url) ? `<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.cta || '了解更多')} →</a>` : ''}
        </div>`).join('');
      $('#prodCard').hidden = false;
    } catch (e) { /* 後台沒回應就不顯示推薦 */ }
  }

  // ---------- 浮動分享按鈕 ----------
  let SHARE = null, bubbleT = null;
  const fab = $('#shareFab'), fabMain = $('#fabMain'), veil = $('#shareVeil'), bubble = $('#fabBubble');
  const siteUrl = () => location.href.split(/[?#]/)[0];
  const shareText = () => SHARE ? `我測出來是「${SHARE.drink}・${SHARE.title}」🧋\n${SHARE.slogan}\n你是哪一杯自媒體奶茶？快來測測看 👉` : '你是哪一杯自媒體奶茶？快來測測看 👉';
  function setFab(open){
    fab.classList.toggle('open', open); veil.classList.toggle('on', open);
    fabMain.setAttribute('aria-expanded', open);
    fabMain.setAttribute('aria-label', open ? '關閉分享選單' : '分享給朋友');
  }
  function showShareFab(on){
    fab.hidden = !on; setFab(false);
    clearInterval(bubbleT); bubble.classList.remove('show');
    if (!on) return;
    const peek = () => { if (fab.classList.contains('open')) return; bubble.classList.add('show'); setTimeout(() => bubble.classList.remove('show'), 3200); };
    setTimeout(peek, 1800);
    bubbleT = setInterval(peek, 14000);
  }
  fabMain.addEventListener('click', () => setFab(!fab.classList.contains('open')));
  veil.addEventListener('click', () => setFab(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setFab(false); });
  $('#fabMenu').addEventListener('click', async e => {
    const b = e.target.closest('[data-share]'); if (!b) return;
    const url = siteUrl(), text = shareText();
    const open = u => window.open(u, '_blank', 'noopener,width=620,height=640');
    switch (b.dataset.share) {
      case 'line': open('https://line.me/R/share?text=' + encodeURIComponent(text + ' ' + url)); break;
      case 'fb': open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url)); break;
      case 'threads': open('https://www.threads.net/intent/post?text=' + encodeURIComponent(text + ' ' + url)); break;
      case 'copy':
        try { await navigator.clipboard.writeText(text + ' ' + url); toast('連結複製好了，快貼給朋友 💕'); }
        catch (err) { prompt('複製這段文字分享給朋友：', text + ' ' + url); }
        break;
      case 'native':
        if (navigator.share) { try { await navigator.share({title: '奶茶定位所', text, url}); } catch (err) {} }
        else { try { await navigator.clipboard.writeText(text + ' ' + url); toast('這台裝置不支援，已幫你複製連結 🔗'); } catch (err) {} }
        break;
      case 'image': await shareImage(); break;
    }
    setFab(false);
  });

  // 產生 1080×1920 限動分享圖
  async function shareImage(){
    if (!SHARE) return;
    toast('圖片製作中… 🎨');
    try { await Promise.all([document.fonts.load('64px Huninn'), document.fonts.load('bold 40px "Noto Sans TC"')]); } catch (e) {}
    const W = 1080, H = 1920, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const F = (size, w='') => `${w} ${size}px Huninn, "Noto Sans TC", sans-serif`;
    // 背景
    g.fillStyle = '#FBF5EC'; g.fillRect(0,0,W,H);
    const dots = [['#EBDCC8',140,220,180],['#F5EADB',960,520,150],['#F2C6C2',120,1500,90],['#D9C8E6',950,1650,110],['#CFDDB7',880,180,60]];
    dots.forEach(([col,x,y,r]) => { g.fillStyle = col; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); });
    g.fillStyle = 'rgba(74,50,38,.08)';
    for (let i=0;i<26;i++){ g.beginPath(); g.arc((i*137)%W, (i*389)%H, 8 + (i%4)*6, 0, 7); g.fill(); }
    // 卡片
    const rr = (x,y,w,h,r) => {
      g.beginPath();
      if (g.roundRect) return g.roundRect(x,y,w,h,r);
      r = Math.min(r, w/2, h/2);
      g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
    };
    g.fillStyle = '#E2CDB3'; rr(90,250,900,1400,64); g.fill();
    g.fillStyle = '#FFFDF9'; rr(90,236,900,1400,64); g.fill();
    g.strokeStyle = '#E6D3BD'; g.lineWidth = 5; g.stroke();
    g.textAlign = 'center';
    g.fillStyle = '#8E7766'; g.font = F(40); g.fillText('奶茶定位所 · 我的自媒體奶茶人格', W/2, 170);
    g.fillStyle = '#EBDCC8'; rr(W/2-210, 300, 420, 70, 35); g.fill();
    g.fillStyle = '#8A5E3F'; g.font = F(36); g.fillText(`${SHARE.nick} 的奶茶人格`.slice(0,16), W/2, 348);
    // 杯子
    const cx = W/2, top = 430, s = 2.4;
    g.save(); g.translate(cx - 80*s, top); g.scale(s, s);
    g.save(); g.translate(98,37); g.rotate(14*Math.PI/180); g.fillStyle = '#F2C6C2'; rr(-6,-35,12,70,6); g.fill(); g.restore();
    g.fillStyle = '#C08B5C'; g.beginPath(); g.ellipse(80,44,62,14,0,0,7); g.fill();
    g.fillStyle = '#F4E6D3'; g.strokeStyle = '#8A5E3F'; g.lineWidth = 4; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(26,50); g.lineTo(134,50); g.lineTo(122,174); g.quadraticCurveTo(120,186,108,186); g.lineTo(52,186); g.quadraticCurveTo(40,186,38,174); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = SHARE.color; g.beginPath(); g.moveTo(30,84); g.lineTo(130,84); g.lineTo(122,176); g.quadraticCurveTo(120,186,110,186); g.lineTo(50,186); g.quadraticCurveTo(40,186,38,176); g.closePath(); g.fill();
    if (SHARE.color2) { g.fillStyle = SHARE.color2; g.beginPath(); g.moveTo(126.5,136); g.lineTo(122,176); g.quadraticCurveTo(120,186,110,186); g.lineTo(50,186); g.quadraticCurveTo(40,186,38,176); g.lineTo(33.5,136); g.quadraticCurveTo(56.75,144,80,136); g.quadraticCurveTo(103.25,128,126.5,136); g.closePath(); g.fill(); }
    g.fillStyle = '#4A3226';
    [[62,106],[98,106]].forEach(([x,y]) => { g.beginPath(); g.ellipse(x,y,7,9,0,0,7); g.fill(); });
    g.fillStyle = '#fff'; [[64,102],[100,102]].forEach(([x,y]) => { g.beginPath(); g.arc(x,y,2.6,0,7); g.fill(); });
    g.fillStyle = '#F2A7A0'; [[48,121],[112,121]].forEach(([x,y]) => { g.beginPath(); g.ellipse(x,y,9,5,0,0,7); g.fill(); });
    g.strokeStyle = '#4A3226'; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(70,117); g.quadraticCurveTo(80,129,90,117); g.stroke();
    g.fillStyle = '#4A3226'; [[58,166],[78,170],[98,165],[68,152],[90,150]].forEach(([x,y]) => { g.beginPath(); g.arc(x,y,8,0,7); g.fill(); });
    g.restore();
    // 名稱
    g.fillStyle = '#8A5E3F'; g.font = F(84); g.fillText(SHARE.drink, W/2, 1010);
    g.font = F(64); g.fillText('・' + SHARE.title + '・', W/2, 1095);
    g.fillStyle = '#8E7766'; g.font = F(38); g.fillText(SHARE.slogan, W/2, 1170, 820);
    // 標籤
    g.font = F(34);
    const tags = SHARE.tags.map(t => '# ' + t);
    const tw = tags.map(t => g.measureText(t).width + 50), total = tw.reduce((a,b)=>a+b,0) + 20*(tags.length-1);
    let x = W/2 - total/2;
    tags.forEach((t,i) => { g.fillStyle = '#F5EADB'; rr(x,1215,tw[i],64,32); g.fill(); g.fillStyle = '#8A5E3F'; g.fillText(t, x + tw[i]/2, 1259); x += tw[i] + 20; });
    // 前三特質
    g.textAlign = 'left';
    SHARE.traits.forEach((t,i) => {
      const y = 1340 + i*62;
      g.fillStyle = '#3B2A20'; g.font = F(34); g.fillText(t.name, 200, y + 12);
      g.fillStyle = '#F5EADB'; rr(360, y-14, 440, 26, 13); g.fill();
      g.fillStyle = '#C08B5C'; rr(360, y-14, 440*t.v/100, 26, 13); g.fill();
      g.fillStyle = '#8E7766'; g.fillText(String(t.v), 830, y + 12);
    });
    g.textAlign = 'center';
    g.fillStyle = '#8E7766'; g.font = F(32); g.fillText('最適合：' + SHARE.top.slice(0,2).join('、'), W/2, 1580, 820);
    // CTA
    g.fillStyle = '#4A3226'; rr(170,1700,740,120,60); g.fill();
    g.fillStyle = '#FBF5EC'; g.font = F(46); g.fillText('你是哪一杯？快來測 🧋', W/2, 1776);
    g.fillStyle = '#8E7766'; g.font = F(28); g.fillText(siteUrl().replace(/^https?:\/\//,''), W/2, 1870, 960);

    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const file = new File([blob], `奶茶人格-${SHARE.title}.png`, {type: 'image/png'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], text: shareText() + ' ' + siteUrl()}); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('圖片下載好了，分享到限動吧 📸');
  }

  // ---------- header actions ----------
  $('#resetBtn').addEventListener('click', () => {
    if (!confirm('要清空所有答案重新開始嗎？')) return;
    S = blank(); save();
    $$('[data-bind]').forEach(el => el.value = '');
    syncChips(); validate(); go(0);
  });
  $('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem(KEY+'-theme', root.dataset.theme); } catch(e) {}
  });
  try { const t = localStorage.getItem(KEY+'-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}

  // ---------- init ----------
  syncChips(); validate();
  const resume = S.step === 4 ? 5 : S.step;
  go(resume === 5 && S.answers.filter(a=>a!=null).length < QUIZ.length ? 0 : resume);
})();
</script>
